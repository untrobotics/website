# HTTP(S) ingress for the website (ingress-nginx).
#
# WAF + rate-limiting here is the cluster-native replacement for host-level
# fail2ban: ModSecurity + the OWASP Core Rule Set blocks the vulnerability/
# web-shell scanners, and the rate limits cap brute bursts. TLS is expected to
# be issued by cert-manager (uncomment the annotation + tls block).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: untrobotics
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    # WAF
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    # Rate limiting (per client IP)
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts:
  #       - untrobotics.com
  #       - www.untrobotics.com
  #     secretName: untrobotics-tls
  rules:
    - host: www.untrobotics.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: untrobotics.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

# NOTE on the botathon WS relay: the ESP32 firmware connects to
# untrobotics.com:81 (plain ws). Ingress handles 80/443 only, so to expose the
# relay externally either (a) give driver-ws its own LoadBalancer Service on
# :81, or (b) update the firmware to use wss://.../ on 443 and route a path here.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    # Prod tracks master. A release is a develop->master merge: CI builds the
    # changed images and (authenticating with the DEVELOP_SYNC_PAT secret, since
    # master is protected) pins their immutable sha tags into this overlay on
    # master with a [skip ci] commit; the automated sync below then rolls prod.
    # No version tags, no deploy/prod branch.
    targetRevision: master
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics-prod
  syncPolicy:
    # Auto-deploy on merge to master. selfHeal reverts out-of-band drift back to
    # git. Prune is deliberately left off so Argo never deletes resources it no
    # longer sees in git (belt-and-braces around the out-of-band Secrets and the
    # promote flow) — enable it later once the automated flow is trusted.
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    # Prod tracks the CI-owned deploy/prod branch. Cut a release by pushing a
    # version tag (git tag vX.Y.Z && git push --tags): CI builds the images and
    # the deploy-prod job force-publishes the release overlay to deploy/prod,
    # which the automated sync below then rolls out. No manual develop->master
    # promote. (master is protected + the github-actions bot can't push it, so the
    # release artifact lives on this separate unprotected branch — same pattern as
    # deploy/dev for the dev environment.)
    targetRevision: deploy/prod
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics-prod
  syncPolicy:
    # Auto-deploy on merge to master. selfHeal reverts out-of-band drift back to
    # git. Prune is deliberately left off so Argo never deletes resources it no
    # longer sees in git (belt-and-braces around the out-of-band Secrets and the
    # promote flow) — enable it later once the automated flow is trusted.
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    targetRevision: chore/reconcile-prod-drift
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

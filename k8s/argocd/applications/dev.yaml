apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    # Dev tracks develop for continuous deployment: every push to develop has CI
    # build the images and bump the pinned sha tag in k8s/overlays/dev, which the
    # automated sync below then rolls out.
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics-dev
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

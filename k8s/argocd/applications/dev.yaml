apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    # Dev tracks develop. On each push to develop, CI builds the changed images
    # and (via DEVELOP_SYNC_PAT — develop has enforce_admins off, so the admin PAT
    # pushes non-force) pins their sha tags into this overlay on develop with a
    # [skip ci] commit; the automated sync below then rolls dev. Mirrors prod on
    # master. No deploy/dev branch anymore.
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics-dev
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

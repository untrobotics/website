# Observe-only Application for the current website stack. No syncPolicy = MANUAL
# sync, no auto-prune, no self-heal: Argo shows health + git-vs-live drift but does
# NOT change anything until you click Sync. During the dev/prod migration this gets
# split into two Applications pointing at k8s/overlays/{dev,prod}.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: untrobotics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/untrobotics/website.git
    targetRevision: chore/reconcile-prod-drift   # TODO: track develop/main once merged
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: untrobotics

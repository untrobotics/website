apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: untrobotics-prod
resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml
  - good-standing-cronjob.yaml
  - newsletter-cronjob.yaml
patches:
  - path: config-patch.yaml
  # Pull the private GHCR images using the out-of-band ghcr-pull secret
  # (created in untrobotics-prod: kubectl -n untrobotics-prod create secret
  #  docker-registry ghcr-pull --docker-server=ghcr.io ...). See deploy/runbook.md.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull
  # Run the interactive Discord bot in prod (base ships it at replicas: 0 so it
  # runs in exactly one environment). Only ONE instance may hold the gateway
  # connection — the dev bot must be scaled to 0 before this syncs.
  - target:
      kind: Deployment
      name: discord-bot
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
# Prod runs immutable, versioned images built + pushed by CI to GHCR.
# Promote a new build by bumping newTag to a freshly-tagged vX.Y.Z and syncing.
images:
  - name: untrobotics-web
    newName: ghcr.io/untrobotics/website
    newTag: "v1.0.57"
  - name: untrobotics-driver-ws
    newName: ghcr.io/untrobotics/website-driver-ws
    newTag: "v1.0.3"
  - name: untrobotics-discord-bot
    newName: ghcr.io/untrobotics/website-discord-bot
    newTag: "v1.0.57"

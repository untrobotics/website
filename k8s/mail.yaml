# Self-hosted email forwarder (Postfix + SRS). NOT part of `kubectl apply -k k8s/`
# by default — deploy deliberately (it owns the domain's MX). See deploy/runbook.md.
#
#   kubectl apply -f k8s/mail.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-aliases
  namespace: untrobotics
data:
  virtual: |
    # Catch-all: every address @untrobotics.com forwards to the club inbox.
    # The original recipient stays in the To:/Received headers, so you can filter
    # in Gmail by e.g.  to:webmaster@untrobotics.com  to label per alias.
    # (Add explicit "alias  dest" lines above this to override the catch-all.)
    @untrobotics.com   untroboticsclub@gmail.com
---
# The mail-srs Secret (SRS_SECRET) is created out-of-band so re-applying this file
# never clobbers it:  kubectl -n untrobotics create secret generic mail-srs \
#   --from-literal=SRS_SECRET="$(openssl rand -hex 32)"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  namespace: untrobotics
  labels:
    app: mail
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate          # only one MTA should bind the queue/port at a time
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      containers:
        - name: mail
          # Built on the node and imported into k3s (see deploy/build-and-load-images.sh).
          image: untrobotics-mail:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 25, name: smtp }
          readinessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: MAIL_HOSTNAME
              value: mail.untrobotics.com
            - name: SRS_DOMAIN
              value: untrobotics.com
            - name: SRS_SECRET
              valueFrom:
                secretKeyRef:
                  name: mail-srs
                  key: SRS_SECRET
                  optional: true   # falls back to an ephemeral secret if unset
          volumeMounts:
            - name: aliases
              mountPath: /config
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
      volumes:
        - name: aliases
          configMap:
            name: mail-aliases
---
apiVersion: v1
kind: Service
metadata:
  name: mail
  namespace: untrobotics
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # preserve the sending server's real IP
  selector:
    app: mail
  ports:
    - { name: smtp, port: 25, targetPort: 25, protocol: TCP }

# PHP/Apache application.
#
# replicas is 1 for now: PHP sessions are file-based, so multiple pods would not
# share login state. Move sessions to Redis (or enable sticky sessions at the
# ingress) before scaling beyond 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Built on the node and imported into k3s containerd (deploy/build-and-load-images.sh).
          # For a registry-based multi-node cluster, override via kustomization `images:`.
          image: untrobotics-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secrets
          volumeMounts:
            - name: forward-logs
              mountPath: /var/log/forward
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Host
                  value: www.untrobotics.com
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # Tails the Apache error log and posts new lines to the Discord web-logs
        # channel via admin-cli.php (which filters scanner spam). Same image so it
        # has PHP + config + the bot token; a cheap pre-filter drops the highest
        # volume 404 scanner noise before spawning PHP.
        - name: log-forwarder
          image: untrobotics-web:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              touch /var/log/forward/error.log
              tail -n0 -F /var/log/forward/error.log \
                | grep --line-buffered -vE 'not found or unable to stat|File does not exist' \
                | while IFS= read -r line; do
                    [ -n "$line" ] && php /var/www/html/api/discord/bots/admin-cli.php "$line" 0 0 >/dev/null 2>&1 || true
                  done
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secrets
          volumeMounts:
            - name: forward-logs
              mountPath: /var/log/forward
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: forward-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80

# PHP/Apache application.
#
# replicas is 1 for now: PHP sessions are file-based, so multiple pods would not
# share login state. Move sessions to Redis (or enable sticky sessions at the
# ingress) before scaling beyond 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: untrobotics
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Built on the node and imported into k3s containerd (deploy/build-and-load-images.sh).
          # For a registry-based multi-node cluster, override via kustomization `images:`.
          image: untrobotics-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: web-config
            - secretRef:
                name: web-secrets
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Host
                  value: www.untrobotics.com
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: untrobotics
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80

# Apply with:  kubectl apply -k k8s/
#
# Before applying:
#   1. Build & push images, then set the REGISTRY/... image refs in web.yaml and
#      driver-ws.yaml (or override here with `images:`).
#   2. Create real secrets (copy secret.example.yaml -> a private secret.yaml,
#      fill values, and apply separately — it is intentionally NOT listed here).
#   3. (Optional) create the schema ConfigMap for MySQL first-init:
#      kubectl -n untrobotics create configmap mysql-initdb \
#        --from-file=01-schema.sql=docker/mysql/initdb/01-schema.sql
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: untrobotics
resources:
  - namespace.yaml
  - config.yaml
  - mysql.yaml
  - web.yaml
  - driver-ws.yaml
  - ingress.yaml

# Example image overrides (uncomment + edit instead of editing the Deployments):
# images:
#   - name: REGISTRY/untrobotics-web
#     newName: ghcr.io/untrobotics/website
#     newTag: "1.0.0"
#   - name: REGISTRY/untrobotics-driver-ws
#     newName: ghcr.io/untrobotics/driver-ws
#     newTag: "1.0.0"

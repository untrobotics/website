# Botathon driver WebSocket relay (Node). Standalone service on :81.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-ws
  namespace: untrobotics
  labels:
    app: driver-ws
spec:
  # OFF by default: the relay performs no origin/auth checks, so it must not be
  # publicly exposed casually. Enable only when needed (e.g. a botathon event):
  #   kubectl -n untrobotics scale deploy/driver-ws --replicas=1
  # It also keeps in-memory per-team state, so do not scale beyond 1.
  replicas: 0
  selector:
    matchLabels:
      app: driver-ws
  template:
    metadata:
      labels:
        app: driver-ws
    spec:
      containers:
        - name: driver-ws
          # Built on the node and imported into k3s containerd (deploy/build-and-load-images.sh).
          image: untrobotics-driver-ws:dev
          imagePullPolicy: IfNotPresent
          # Override to ["node","legacy-server.js"] for the prod-proven variant.
          command: ["node", "server.js"]
          ports:
            - containerPort: 81
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: driver-ws
  namespace: untrobotics
spec:
  selector:
    app: driver-ws
  ports:
    - name: ws
      port: 81
      targetPort: 81

# TEMPLATE ONLY — do NOT commit real secrets. Copy to a private secret.yaml (or
# generate with `kubectl create secret generic web-secrets ...` / sealed-secrets /
# external-secrets) and fill in real values. The web pods load these via envFrom
# and template/config.docker.php reads them with getenv().
apiVersion: v1
kind: Secret
metadata:
  name: web-secrets
  namespace: untrobotics
type: Opaque
stringData:
  # Database
  DATABASE_PASSWORD: ""
  # Core app secrets
  HASH_SALT: ""
  API_SECRET: ""
  # Email / messaging
  SENDGRID_API_KEY: ""
  GROUPME_ACCESS_TOKEN: ""
  GROUPME_OFFICER_CHANNEL_ID: ""
  # Twilio
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FIND_FIRST_QUEUE_SID: ""
  # Discord
  DISCORD_CLIENT_PUBLIC_KEY: ""
  DISCORD_ADMIN_BOT_TOKEN: ""
  DISCORD_APP_CLIENT_ID: ""
  DISCORD_APP_CLIENT_SECRET: ""
  # PayPal
  PAYPAL_BUSINESS_ID: ""
  PAYPAL_PDT_ID_TOKEN: ""
  PAYPAL_API_ACCOUNT: ""
  PAYPAL_API_PASSWORD: ""
  PAYPAL_API_SIGNATURE: ""
  PAYPAL_SANDBOX_BUSINESS_ID: ""
  PAYPAL_SANDBOX_PDT_ID_TOKEN: ""
  # Printful / Google / misc
  PRINTFUL_API_KEY: ""
  GOOGLE_CLIENT_API_KEY: ""
  GOOGLE_RECAPTCHA_KEY: ""
  NAMECOM_API_USERNAME: ""
  NAMECOM_API_KEY: ""
  IP2LOCATION_EMAIL: ""
  IP2LOCATION_PASS: ""
  TIMEZONEDB_API_KEY: ""
---
# Separate secret for the MySQL StatefulSet itself.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secrets
  namespace: untrobotics
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: ""
  MYSQL_DATABASE: "untrobotics"
  MYSQL_USER: "untrobotics-web"
  MYSQL_PASSWORD: ""   # must match DATABASE_PASSWORD in web-secrets

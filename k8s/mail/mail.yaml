# Self-hosted email forwarder (Postfix + SRS). Deployed via k8s/mail (the "mail"
# Argo Application) into the untrobotics-mail namespace. It owns the domain's MX.
# The mail-srs Secret is created out-of-band (see deploy/runbook.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-aliases
data:
  virtual: |
    # OrgSync/CampusLabs auto-welcome ingest. Route this ONE address to the local
    # pipe transport instead of the Gmail catch-all: it is rewritten to the
    # internal pseudo-domain orgsync-ingest.local, which transport_maps sends to
    # the `orgsync-pipe` service (master.cf) -> orgsync-ingest.py -> POST to the
    # web handler api/sendgrid-inbound/parse.php. MUST stay ABOVE the catch-all.
    # OrgSync/CampusLabs already sends to auto-ingest.untrobotics.com (unchanged —
    # only its MX moves from SendGrid to this relay). Route the whole subdomain to
    # the pipe so no OrgSync reconfiguration is needed.
    @auto-ingest.untrobotics.com   orgsync@orgsync-ingest.local
    orgsync@untrobotics.com   orgsync@orgsync-ingest.local
    # Catch-all: every address @untrobotics.com forwards to the club inbox.
    # The original recipient stays in the To:/Received headers, so you can filter
    # in Gmail by e.g.  to:webmaster@untrobotics.com  to label per alias.
    # (Add explicit "alias  dest" lines above this to override the catch-all.)
    @untrobotics.com   untroboticsclub@gmail.com
---
# Persistent mail queue so deferred mail survives pod restarts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mail-spool
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail
  labels:
    app: mail
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate          # only one MTA should bind the queue/port at a time
  selector:
    matchLabels:
      app: mail
  template:
    metadata:
      labels:
        app: mail
    spec:
      containers:
        - name: mail
          # Built on the node and imported into k3s (see deploy/build-and-load-images.sh).
          image: untrobotics-mail:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 25, name: smtp }
          readinessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 30
            periodSeconds: 20
          env:
            - name: MAIL_HOSTNAME
              value: mail.untrobotics.com
            - name: SRS_DOMAIN
              value: untrobotics.com
            - name: SRS_SECRET
              valueFrom:
                secretKeyRef:
                  name: mail-srs
                  key: SRS_SECRET
                  optional: true   # falls back to an ephemeral secret if unset
            # OrgSync auto-welcome ingest: which web namespace to POST to (prod,
            # since OrgSync welcomes are production) and the shared secret that
            # authenticates to api/sendgrid-inbound/parse.php. The secret must
            # equal INGEST_SECRET in the untrobotics-prod `web-secrets`. Created
            # out-of-band as the `mail-ingest` Secret in this (untrobotics-mail)
            # namespace — see deploy/runbook.md. optional:true so the pod starts
            # before the Secret exists (ingest just defers until it does).
            - name: WEB_NS
              value: untrobotics-prod
            - name: INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: mail-ingest
                  key: INGEST_SECRET
                  optional: true
          volumeMounts:
            - name: aliases
              mountPath: /config
              readOnly: true
            - name: spool
              mountPath: /var/spool/postfix
            # Mounted as a DIRECTORY (not subPath): an optional secret consumed
            # via subPath makes the pod fail to start when the secret is absent
            # ("failed to prepare subPath"), which would defeat optional:true.
            # The key lands at /etc/dkim/mail.private; the entrypoint copies it
            # to an opendkim-owned runtime path with safe perms before signing.
            - name: dkim-key
              mountPath: /etc/dkim
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 192Mi }
      volumes:
        - name: aliases
          configMap:
            name: mail-aliases
        - name: spool
          persistentVolumeClaim:
            claimName: mail-spool
        # DKIM signing key. optional:true so the pod starts before the operator
        # creates the Secret; the entrypoint runs Postfix unsigned until it does.
        - name: dkim-key
          secret:
            secretName: mail-dkim
            optional: true
            items:
              - { key: mail.private, path: mail.private }
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: mail
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # preserve the sending server's real IP
  selector:
    app: mail
  ports:
    - { name: smtp, port: 25, targetPort: 25, protocol: TCP }

# OpenDKIM milter for untrobotics.com. Signs outbound mail submitted by our own
# pods (see InternalHosts/TrustedHosts) and verifies inbound mail. Wired into
# Postfix via smtpd_milters/non_smtpd_milters in main.cf.
#
# The signing key is NOT baked into the image: it is mounted at
# /etc/dkim/mail.private from the `mail-dkim` k8s Secret at deploy time. The
# entrypoint only starts OpenDKIM (and keeps the milter enabled) when that key
# is present, so mail still flows unsigned if the secret is missing.

# Listen on localhost so only Postfix (same pod) can reach the milter.
Socket                  inet:8891@localhost

# Run in the foreground under our entrypoint; log to stdout via syslog->stderr.
Background              no
Syslog                  yes
SyslogSuccess          yes

# Drop privileges to the opendkim user (package-created).
UserID                  opendkim
PidFile                 /run/opendkim/opendkim.pid

# --- Signing identity --------------------------------------------------------
Domain                  untrobotics.com
Selector                mail
# The signing key is mounted read-only + root-owned from the mail-dkim Secret at
# /etc/dkim/mail.private. OpenDKIM (RequireSafeKeys) refuses a key it can't own
# with 600 perms, so the entrypoint copies it to this opendkim-owned runtime
# path before starting the daemon.
KeyFile                 /run/opendkim/mail.key

# relaxed/simple: relaxed header canonicalization tolerates the minor header
# rewriting that mailing paths do; simple body avoids body-hash breakage.
Canonicalization        relaxed/simple

# Sign and verify.
Mode                    sv

# Only sign for the exact domain, not subdomains.
SubDomains              no

# Always oversign From to block header-injection/replay of a second From.
OversignHeaders         From

# --- Which hosts get their mail SIGNED (vs merely verified) -------------------
# Mail from these hosts is treated as "ours" and signed. Everything else is
# only verified. Our website + Discord bot inject mail from the pod network.
InternalHosts           /etc/opendkim/TrustedHosts
ExternalIgnoreList      /etc/opendkim/TrustedHosts

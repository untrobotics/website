name: Build and push images

# Builds the app / driver-ws / discord-bot container images and pushes them to
# GitHub Container Registry (ghcr.io/<owner>/...). A `detect` job first works out
# which images actually changed since the previous tag/push and emits a matrix of
# only those; `build` consumes it. So a web-only release doesn't rebuild (and
# can't spuriously fail on) the discord-bot / driver-ws images — which stops the
# false "CI failed" emails from transient action-download rate limits on images we
# didn't need to rebuild.
on:
  push:
    branches:
      - develop
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.f.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          W=false; D=false; B=false
          all() { W=true; D=true; B=true; }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "workflow_dispatch -> build all"; all
          else
            BASE=""
            if [ "$REF_TYPE" = "tag" ]; then
              BASE=$(git describe --tags --abbrev=0 "${REF_NAME}^" 2>/dev/null || true)
            elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            fi
            if [ -z "$BASE" ] || ! git rev-parse -q --verify "${BASE}^{commit}" >/dev/null; then
              echo "No usable diff base ($BASE) -> build all"; all
            else
              CHANGED=$(git diff --name-only "$BASE" HEAD || true)
              echo "Changed since ${BASE}:"; echo "$CHANGED"
              if [ -z "$CHANGED" ]; then
                echo "Empty diff -> build all"; all
              else
                echo "$CHANGED" | grep -qE '^botathon/driver-ws/' && D=true
                echo "$CHANGED" | grep -qE '^discord-bot/'        && B=true
                echo "$CHANGED" | grep -qvE '^(botathon/driver-ws/|discord-bot/)' && W=true
              fi
            fi
          fi
          INC=""
          add() { INC="${INC:+$INC,}$1"; }
          [ "$W" = true ] && add '{"name":"website","context":".","dockerfile":"Dockerfile"}'
          [ "$D" = true ] && add '{"name":"website-driver-ws","context":"botathon/driver-ws","dockerfile":"botathon/driver-ws/Dockerfile"}'
          [ "$B" = true ] && add '{"name":"website-discord-bot","context":"discord-bot","dockerfile":"discord-bot/Dockerfile"}'
          echo "Selected images: website=$W driver_ws=$D discord_bot=$B"
          echo "matrix={\"include\":[$INC]}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Continuous deployment to the dev environment. On a push to develop, take
  # develop's tree, pin the just-built images to their immutable sha tag in the
  # dev overlay, and force-publish it to the CI-owned `deploy/dev` branch. The
  # untrobotics-dev Argo app tracks deploy/dev (auto-sync) and rolls dev.
  #
  # We publish to deploy/dev (not develop) on purpose: develop is protected
  # (3-review PRs + push restricted to a person), and the built-in github-actions
  # bot cannot be granted a branch-protection bypass. deploy/dev is unprotected,
  # so GITHUB_TOKEN can push it; that push does not re-trigger CI (deploy/dev is
  # not in the trigger list).
  deploy-dev:
    needs: [detect, build]
    if: ${{ github.ref == 'refs/heads/develop' && github.event_name == 'push' && fromJSON(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin dev overlay images to this commit's sha tag
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, pathlib
          matrix = json.loads(os.environ["MATRIX"])
          tag = "sha-" + os.environ["SHA"][:7]
          kust_name = {
              "website": "untrobotics-web",
              "website-driver-ws": "untrobotics-driver-ws",
              "website-discord-bot": "untrobotics-discord-bot",
          }
          p = pathlib.Path("k8s/overlays/dev/kustomization.yaml")
          text = p.read_text()
          for item in matrix["include"]:
              kn = kust_name[item["name"]]
              pat = re.compile(r'(- name: ' + re.escape(kn) + r'\n(?:    .*\n)*?    newTag: )"[^"]*"')
              text, cnt = pat.subn(r'\g<1>"' + tag + '"', text)
              print(("bumped " if cnt else "WARN no newTag for ") + kn + (" -> " + tag if cnt else ""))
          p.write_text(text)
          PY

      - name: Force-publish to deploy/dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "dev: auto-deploy ${GITHUB_SHA:0:7}" || echo "overlay unchanged"
          git push --force origin HEAD:deploy/dev

  # Release deploy to prod (URW-47). On a version tag (vX.Y.Z), take the tagged
  # tree, set each image's prod overlay tag to the release version — changed
  # images were built as :vX.Y.Z this run; unchanged images keep the version
  # already running in prod (read from deploy/prod) so they aren't downgraded —
  # then force-publish to the CI-owned `deploy/prod` branch. The untrobotics-prod
  # Argo app tracks deploy/prod (auto-sync) and rolls prod. So a release is just
  # `git tag vX.Y.Z && git push --tags`; no manual develop->master promote.
  #
  # Same rationale as deploy/dev: master is protected and the github-actions bot
  # can't push it, so the release artifact lives on this unprotected branch.
  deploy-prod:
    needs: [detect, build]
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && fromJSON(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set prod overlay image tags for release ${{ github.ref_name }}
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
          VERSION: ${{ github.ref_name }}
        run: |
          git fetch origin deploy/prod || true
          python3 - <<'PY'
          import json, os, re, subprocess, pathlib
          matrix = json.loads(os.environ["MATRIX"])
          version = os.environ["VERSION"]
          changed = {i["name"] for i in matrix["include"]}
          kust_name = {
              "website": "untrobotics-web",
              "website-driver-ws": "untrobotics-driver-ws",
              "website-discord-bot": "untrobotics-discord-bot",
          }
          p = pathlib.Path("k8s/overlays/prod/kustomization.yaml")
          text = p.read_text()

          def tag_of(t, kn):
              m = re.search(r'- name: ' + re.escape(kn) + r'\n(?:    .*\n)*?    newTag: "([^"]*)"', t)
              return m.group(1) if m else None

          # Current running prod versions come from deploy/prod (fall back to the
          # tagged tree's overlay on the very first release).
          try:
              cur = subprocess.check_output(
                  ["git", "show", "origin/deploy/prod:k8s/overlays/prod/kustomization.yaml"], text=True)
          except subprocess.CalledProcessError:
              cur = text

          for ciname, kn in kust_name.items():
              newtag = version if ciname in changed else (tag_of(cur, kn) or tag_of(text, kn))
              text = re.sub(
                  r'(- name: ' + re.escape(kn) + r'\n(?:    .*\n)*?    newTag: )"[^"]*"',
                  r'\g<1>"' + newtag + '"', text)
              print(f"{kn} -> {newtag}" + ("  (released)" if ciname in changed else "  (carried forward)"))
          p.write_text(text)
          PY

      - name: Force-publish to deploy/prod
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "prod: release ${VERSION}" || echo "overlay unchanged"
          git push --force origin HEAD:deploy/prod

# Gzip text assets on the wire (URW-155). The vendor theme CSS is ~48k lines;
# mod_deflate shrinks CSS/JS/HTML ~80-90%, so production serves minimal-size CSS
# automatically on every response — no build step, no per-file minification risk.
# Already-compressed binaries (images, fonts, archives) are left alone.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE \
        text/html \
        text/plain \
        text/css \
        text/xml \
        application/javascript \
        application/x-javascript \
        application/json \
        application/xml \
        application/rss+xml \
        image/svg+xml

    # Don't attempt to re-compress content that's already compressed.
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|ico|zip|gz|bz2|rar|woff2?|ttf|otf|eot|mp4|webm)$ no-gzip dont-vary
</IfModule>

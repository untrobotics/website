# Apache error-log forwarding for the containerised site.
#
# The error log is piped through `tee` so every error line lands in TWO places:
#   1. /var/log/forward/error.log  — a file on an emptyDir shared with the
#      `log-forwarder` sidecar, which tails it and posts each line to Discord
#      via api/discord/bots/admin-cli.php (scanner-spam filtering lives there).
#   2. the container's stderr (>&2) — so `kubectl logs` still shows errors,
#      exactly like the default php:apache image behaviour we want to preserve.
#
# This directive is at server scope. The default vhost (sites-available/
# 000-default.conf) has its own per-vhost `ErrorLog ${APACHE_LOG_DIR}/error.log`
# line removed in the Dockerfile, so the vhost INHERITS this single piped logger
# (Apache spawns one shared logger process rather than one per vhost).
#
# Access logs are deliberately left untouched (still CustomLog -> stdout): we
# only forward the error log to Discord, not 200/404 request noise.
ErrorLog "|/bin/sh -c 'tee -a /var/log/forward/error.log >&2'"
